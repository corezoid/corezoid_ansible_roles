---
# Открыть порты worker в firewalld — только если он запущен на хосте. На старых
# инсталляциях (например ff_uz_prod worker-1/2) firewalld нет, и роль ничего не делает;
# на свежих EL9-хостах он активен из коробки и без этих правил другие воркеры не
# достучатся до epmd/Erlang-дистрибуции, а балансер/мониторинг — до is_ready.
- name: Check firewalld state
  command: firewall-cmd --state
  register: worker_firewalld_state
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - worker-all
    - worker-firewalld

- name: Open worker ports in firewalld
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ worker_firewalld_source }} port port={{ item }} protocol=tcp accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ worker_firewalld_ports }}"
  when:
    - worker_firewalld_state.rc == 0
    - worker_firewalld_state.stdout | trim == "running"
  tags:
    - worker-all
    - worker-firewalld
