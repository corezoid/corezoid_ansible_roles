---
# Family split: package acquisition (nginx + the RPM-only Corezoid static payloads) is the
# only RHEL/Debian divergence in this role (everything below "Create directory structure" is
# portable). RHEL body moved verbatim to install_RedHat.yml; Debian/Ubuntu uses the nginx.org
# apt repo + an rpm2cpio stopgap for corezoid-web-admin/conf-agent-client (install_Debian.yml).
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: "front_capi role supports only RedHat/Debian, got '{{ ansible_os_family }}'"
    quiet: true
  tags: [front-capi-all]

# Tags on a dynamic `include_tasks` gate whether Ansible walks into the file at all — unlike
# `import_tasks`, they are NOT reliably inherited by tasks inside it (confirmed empirically),
# so the include must ALSO carry `apply.tags`, or a targeted `--tags front-capi-app` run
# (an existing tag on the RHEL "Yum clean all" task, preserved verbatim in install_RedHat.yml)
# would silently skip the whole include. IMPORTANT: `apply.tags` is unioned onto EVERY task in
# the included file (confirmed empirically) — it must therefore hold only the tags common to
# every task (front-capi-all/-nginx-setup/-nginx-package), NOT the narrower front-capi-app tag,
# or the nginx/web-admin/conf-agent-client install tasks would incorrectly start matching a
# `--tags front-capi-app` run too. The narrow tag stays only on the include's own `tags:` (so
# the walk-in happens) and on "Yum clean all"'s own literal tag (unchanged, preserved verbatim)
# so only that one task actually matches the narrow filter.
- name: Install nginx + Corezoid static payloads (RedHat/Amazon)
  include_tasks:
    file: install_RedHat.yml
    apply:
      tags: [front-capi-all, front-capi-nginx-setup, front-capi-nginx-package]
  when: ansible_os_family == 'RedHat'
  tags: [front-capi-all, front-capi-app, front-capi-nginx-setup, front-capi-nginx-package]

- name: Install nginx + Corezoid static payloads (Debian/Ubuntu)
  include_tasks:
    file: install_Debian.yml
    apply:
      tags: [front-capi-all, front-capi-nginx-setup, front-capi-nginx-package]
  when: ansible_os_family == 'Debian'
  tags: [front-capi-all, front-capi-app, front-capi-nginx-setup, front-capi-nginx-package]

# Create directory structure
- name: Create directory structure
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('nginx') }}"
    group: "{{ item.group | default('nginx') }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ top_dir }}/img" }
    - { path: "{{ top_dir }}/img/favicon" }
    - { path: "{{ top_dir }}/img/logo" }
    - { path: "{{ nginx_ssl_dir }}", owner: "root", group: "root" }
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-setup-img
    - front-capi-nginx-setup-ssl

# Deploy default branding assets
- name: Add default branding assets
  copy:
    src: "files/img/{{ item }}"
    dest: "{{ top_dir }}/img"
    owner: "nginx"
    group: "nginx"
    mode: "0644"
  loop:
    - "favicon"
    - "logo"
  tags:
    - front-capi-app
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-setup-img

#Remove default Nginx configurations
- name: Delete nGinx default configs
  file:
    path: "/etc/nginx/conf.d/{{ item }}"
    state: absent
  loop:
    - "default.conf"
    - "virtual.conf"
    - "ssl.conf"
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-delete

# Create Nginx configurations
- name: Create Nginx configuration files
  template:
    src: "templates/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: "{{ corezoid_release }}-01-corezoid.com.conf.j2", dest: "/etc/nginx/conf.d/01-corezoid.com.conf" }
    - { src: "{{ corezoid_release }}-superadmin.conf.j2", dest: "/etc/nginx/conf.d/superadmin.conf" }
    - { src: "upstream.conf.j2", dest: "/etc/nginx/conf.d/corezoid-upstream.conf" }
    - { src: "status.conf.j2", dest: "/etc/nginx/conf.d/corezoid-status.conf" }
    - { src: "nginx.conf.j2", dest: "/etc/nginx/nginx.conf", mode: "0600" }
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-configs
    - front-capi-nginx-mainconfig

# Behind a TLS-terminating HAProxy (front_behind_lb: true) the front serves plain :80 and
# never uses its own cert — HAProxy owns TLS (see CLAUDE.md "Front nginx behind HAProxy").
# front_behind_lb defaults false so RHEL/existing envs render this exactly as before.
- name: Create Nginx SSL cert-corezoid include
  template:
    src: "templates/cert-corezoid.j2"
    dest: "{{ nginx_ssl_dir }}/cert-corezoid"
    owner: root
    group: root
    mode: "0600"
  when: not (front_behind_lb | default(false))
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-configs
    - front-capi-nginx-mainconfig

# Deploy SSL certificate
# Installs SSL certificate with secure permissions
- name: Copy SSL certificate data
  copy:
    content: "{{ nginx_ssl_content }}"
    dest: "{{ nginx_ssl_filename }}"
    owner: "root"
    group: "root"
    mode: "0600"
  when: not (front_behind_lb | default(false))
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-setup-ssl

# Create symbolic links
- name: Create symbolic links
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: "{{ item.state | default('link') }}"
  loop:
    - { src: "/ebsmnt/www/conf-agent-client", dest: "/ebsmnt/www/conf-agent-client/superadmin" }
    - { src: "{{ nginx_ssl_filename }}", dest: "{{ nginx_ssl_dir }}/corezoid.crt", behind_lb_skip: true }
    - { src: "{{ nginx_ssl_filename }}", dest: "{{ nginx_ssl_dir }}/corezoid.key", behind_lb_skip: true }
  when: not (item.behind_lb_skip | default(false) and (front_behind_lb | default(false)))
  tags:
    - front-capi-app
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-configs
    - front-capi-nginx-symlink
    - front-capi-nginx-setup-ssl

# Validate AFTER the cert files exist: on a direct-TLS host (front_behind_lb: false,
# the default) the 01-corezoid.com.conf/superadmin.conf configs `include ssl/cert-corezoid`,
# which itself references ssl/corezoid.crt/.key — running `nginx -t` any earlier (e.g. right
# after templating, before the cert copy + symlinks above) would fail on a clean bootstrap
# because those files don't exist yet.
- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  tags:
    - front-capi-all
    - front-capi-nginx-setup


# Enable and start Nginx service
# Ensures Nginx starts on boot and is running
- name: Enable nGinx to survive reboot
  service:
    name: nginx
    state: started
    enabled: yes
  tags:
    - front-capi-all
    - front-capi-nginx-setup
    - front-capi-nginx-system

# Restart Nginx to apply changes
# Forces Nginx to reload with new configuration
- name: Restart nGinx
  service:
    name: nginx
    state: restarted
  tags:
    - capi-all
    - capi-nginx-setup
    - capi-nginx-restart