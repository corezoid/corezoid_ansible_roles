---
# tasks file for usercode
# Set service name as a fact for consistent usage
- name: Set service name variable
  set_fact:
    service_name: "usercode"
  tags:
    - always

# Guard: the Corezoid repository must have been configured by role 'yum' in this play.
# Without it dnf fails later with "No package <app>-<ver> available" (or, on EL9 with a
# SHA1-signed repo, a signature error) — see INF-30520. Add `role: yum` before this role.
- name: Assert Corezoid repository is configured (role yum)
  ansible.builtin.stat:
    path: /etc/yum.repos.d/corezoid-prod.repo
  register: cz_repo_file
  when: ansible_os_family == "RedHat"
  tags:
    - usercode-all
    - usercode-install

- name: Fail when corezoid-prod.repo is missing
  ansible.builtin.assert:
    that:
      - cz_repo_file.stat.exists
    fail_msg: >-
      /etc/yum.repos.d/corezoid-prod.repo is missing on {{ inventory_hostname }}: this play does not
      run role 'yum' before role 'usercode'. Add `- role: yum` (it derives the repo path from
      corezoid_release and the OS; see roles/yum/README.md).
    quiet: true
  when: ansible_os_family == "RedHat"
  tags:
    - usercode-all
    - usercode-install

# Clean YUM cache to ensure fresh package metadata
# Removes all cached package data to prevent installation issues
- name: Yum clean all
  command: yum clean all
  tags:
    - usercode-all
    - usercode-install

# Install Usercode package
# Installs or updates the usercode package from AWS Corezoid repository
- name: Install packages
  yum:
    name: "{{ service_name }}-{{ usercode.version }}"
    state: present
    update_cache: yes
    disablerepo: "*"
    enablerepo: "aws-corezoid"
    disable_gpg_check: yes
  tags:
    - usercode-all
    - usercode-install

# Install eu-stack (elfutils) — needed since 6.13 to capture native stacks of a
# stuck cnode (V8 14). gdb is the alternative; elfutils is lighter on the cnode.
# elfutils ships in the base OS repo (BaseOS), not aws-corezoid, so install from
# the default enabled repos across all supported RPM OSes (CentOS/RHEL/OracleLinux
# 7/8/9, Amazon Linux 2/2023, x86 & arm). Best-effort: some client boxes are
# air-gapped or on EOL base repos (e.g. CentOS 7) — a missing repo must NOT break
# the usercode rollout, since eu-stack is a diagnostic aid, not a runtime dep. To
# guarantee it everywhere, add elfutils to the aws-corezoid repo build.
- name: Install elfutils (eu-stack) for cnode native stack dumps
  yum:
    name: elfutils
    state: present
  register: usercode_elfutils
  failed_when: false
  tags:
    - usercode-all
    - usercode-install

- name: Warn if elfutils could not be installed (native cnode stacks won't be capturable here)
  debug:
    msg: "elfutils not installed on {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_major_version }}) — install it manually or add it to the aws-corezoid repo."
  when: usercode_elfutils is failed or (usercode_elfutils.rc is defined and usercode_elfutils.rc != 0)
  tags:
    - usercode-all
    - usercode-install

# Configure kernel parameters (network + memory/VM for V8 cnode workload)
- name: Configure sysctl parameters in /etc/sysctl.conf
  lineinfile:
    path: /etc/sysctl.conf
    line: "{{ item }}"
    state: present
  loop:
    - "net.core.rmem_max = 209715200"
    - "net.core.wmem_max = 209715200"
    - "vm.overcommit_memory = 1"
    - "vm.overcommit_ratio = 100"
    - "vm.max_map_count = 262144"
    - "kernel.yama.ptrace_scope = 0"
  tags:
    - usercode-all
    - usercode-sysctl
    - usercode-install

- name: Apply sysctl parameters
  command: sysctl -p
  tags:
    - usercode-all
    - usercode-sysctl
    - usercode-install

# Create all required directories in a single task using a loop
- name: Create application directories
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    state: directory
    mode: "{{ item.mode }}"
    recurse: "{{ item.recurse | default(false) }}"
  loop:
    - { path: "{{ conf_dir }}", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ top_dir }}/erlang/{{ service_name }}/log", owner: "{{ app_user }}", group: "{{ app_user }}", mode: "0755" }
    - { path: "{{ top_dir }}/erlang/{{ service_name }}", owner: "{{ app_user }}", group: "{{ app_user }}", mode: "0700", recurse: yes }
  tags:
    - usercode-all
    - usercode-config
    - usercode-install

# Generate Usercode configuration
# Creates the main configuration file from template
- name: Create app configs
  template: src=templates/{{ corezoid_release }}-{{ service_name }}.config.j2 dest={{ usercode.config }} owner={{ app_user }} group={{ app_user }} mode=0500
  tags:
    - usercode-all
    - usercode-config
    - usercode-config-file

# Legacy OpenSSL 1.0 library for EL8 (ST-5823 / COR-10772).
# usercode el8 packages <= 6.13.x link libcrypto.so.1.0.0 (absent on every EL8 distro);
# OTP 28 builds (>= 6.14) and all EL9 packages do not. Gated by
# usercode_install_legacy_libcrypto (defaults/main.yml): RHEL-family 8 and release < 6.14.0.
# Previously OracleLinux 8 only, so RHEL/Rocky/Alma 8 hosts failed to boot usercode on 6.13.0.
- name: Upload legacy libcrypto.so.1.0.0 (EL8 usercode builds linked against OpenSSL 1.0)
  copy: src=files/libcrypto.so.1.0.0 dest=/lib64/libcrypto.so.1.0.0
  when: usercode_install_legacy_libcrypto | bool
  tags:
    - usercode-all
    - usercode-install
    - usercode-add-libs

# Deploy JavaScript libraries to CCE directory
# Installs required JavaScript libraries for CCE functionality
- name: Upload usercode libs
  template: src=files/{{ item }} dest={{ top_dir }}/erlang/usercode/lib/cce-0.9/priv/libs/{{ item }}
  with_items:
    - moment-timezone.js
    - sha256.js
    - sha512.js
    - hex.js
  tags:
    - usercode-all
    - usercode-install
    - usercode-add-libs

# Deploy JavaScript libraries to main libs directory
# Installs required JavaScript libraries for general functionality
- name: Upload usercode libs
  template: src=files/{{ item }} dest={{ top_dir }}/erlang/usercode/libs/{{ item }}
  with_items:
    - moment-timezone.js
    - sha256.js
    - sha512.js
    - hex.js
  tags:
    - usercode-all
    - usercode-install
    - usercode-add-libs

# Enable and start Usercode service
# Ensures the service starts automatically on boot and is running
- name: Enable services to survive reboot
  service:
    name: "{{ service_name }}"
    enabled: yes
    state: started
  tags:
    - usercode-all
    - usercode-start

# Create Monit monitoring configuration
# Sets up monitoring for the Usercode service
- name: Create monit file
  template: src=templates/{{ item }}.monit.j2 dest=/etc/monit.d/{{ item }} owner=root group=root mode=0600
  with_items:
    - usercode
  register: monit_file
  tags:
    - usercode-all
    - usercode-monit

# Reload Monit configuration
# Applies any changes to the Monit monitoring setup
- name: Reload monit if config file changed
  service:
    name: monit
    state: reloaded
  when: monit_file.changed
  tags:
    - usercode-all
    - usercode-monit
