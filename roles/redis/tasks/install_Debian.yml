# Debian/Ubuntu install path (Ubuntu 22.04 "jammy"): official packages.redis.io apt repo.
# The Ubuntu distro package (jammy main) is Redis 6.0.16 and rejects the 7.x-only config
# directives in templates/redis-box-*.conf.j2 (appenddirname, hash-max-listpack-*, ...),
# so a first-class 7.x source is required — see redis-debian-port-plan.md §2.1.
#
# Verified live (2026-07-09) against packages.redis.io/deb jammy Packages: redis-server and
# redis-tools both ship 6:7.2.4-1rl1~jammy1, matching the RHEL bundled 7.2.4 exactly.

- name: "Debian | install apt prerequisites"
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: "Debian | ensure keyrings dir"
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Debian | install packages.redis.io signing key (dearmored keyring)"
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -fsSL {{ redis_apt_key_url }}
    | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/redis-archive-keyring.gpg

- name: "Debian | add packages.redis.io apt repository ({{ ansible_distribution_release }})"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] {{ redis_apt_repo_url }} {{ ansible_distribution_release }} main"
    filename: redis
    state: present
    update_cache: true

# Glob the packaging revision (e.g. ~jammy1/~jammy2) rather than pinning the exact string:
# packages.redis.io occasionally rebuilds a version with a bumped revision suffix without
# changing the actual Redis version, and a hard revision pin would then break new-node
# bootstrap/DR recovery once that exact build is superseded. The Redis *version* itself
# ({{ redis_version }}) stays an exact pin (per box.yml, standardized on 7.2.4) — only the
# packaging revision floats.
- name: "Debian | install Redis {{ redis_version }} (pinned, redis-server + redis-tools)"
  ansible.builtin.apt:
    name:
      - "redis-server={{ redis_deb_epoch }}:{{ redis_version }}-*"
      - "redis-tools={{ redis_deb_epoch }}:{{ redis_version }}-*"
    state: present

- name: "Debian | hold redis-server/redis-tools at the pinned version"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - redis-server
    - redis-tools

# The packaged redis-server.service auto-starts a default instance on :6379 reading
# /etc/redis/redis.conf — collides with this role's own redis-cache/-counters/-timers
# instances (all :6379 on their respective hosts). No RHEL analogue (the remi RPM does
# not auto-start a default instance the same way), so this lives only here.
#
# Check the unit's presence explicitly (rather than a blanket failed_when: false on the
# mask task itself) so a genuine mask/stop failure still surfaces loudly instead of being
# silently swallowed alongside the "unit doesn't exist" case — a swallowed real failure here
# would leave the packaged instance running and bound to :6379, exactly the collision this
# task exists to prevent.
- name: "Debian | check whether the packaged redis-server.service unit exists"
  ansible.builtin.command: systemctl list-unit-files redis-server.service
  register: redis_server_unit_check
  changed_when: false
  failed_when: false

- name: "Debian | stop + disable + mask the packaged default redis-server.service"
  ansible.builtin.systemd:
    name: redis-server
    state: stopped
    enabled: false
    masked: true
  when: "'redis-server.service' in redis_server_unit_check.stdout"
