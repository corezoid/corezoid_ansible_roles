---
# EL9 package-signature preflight (RHEL / Oracle Linux / Rocky / AlmaLinux 9+).
#
# Why: RHEL 9 family hosts with the DEFAULT or FUTURE crypto policy refuse RPMs
# signed with RSA/SHA1. Corezoid repositories built before the SHA256 re-signing
# (os-matrix/sign-sha256) are SHA1-signed, and the failure surfaces late, inside
# an application role, as:
#   rpm:  "Signature not supported. Hash algorithm SHA1 not available."
#   dnf:  "Public key for <pkg>.rpm is not installed. Failing package is: <nevra>"
#         or "Problem opening package <pkg>.rpm"
# This task set downloads one small package from aws-corezoid, reads its
# signature digest from the header (works regardless of the policy) and fails
# the play with a readable message before anything is installed.
#
# Included from main.yml only for RedHat-family (non-Amazon) major >= 9 with the
# public repository (gpgcheck=1). Variables: see defaults/main.yml.

- name: Preflight | current crypto policy
  ansible.builtin.command: update-crypto-policies --show
  register: cz_preflight_policy
  changed_when: false
  failed_when: false

- name: Preflight | locate one package in aws-corezoid
  ansible.builtin.command: >-
    dnf -q repoquery --disablerepo='*' --enablerepo=aws-corezoid
    --latest-limit 1 --location {{ corezoid_repo_preflight_package }}
  register: cz_preflight_location
  changed_when: false
  failed_when: false

- name: Preflight | repository reachable and package present
  ansible.builtin.assert:
    that:
      - cz_preflight_location.rc == 0
      - cz_preflight_location.stdout_lines | length > 0
    fail_msg: >-
      aws-corezoid repository check failed on {{ inventory_hostname }}:
      '{{ corezoid_repo_preflight_package }}' not found at
      {{ corezoid_repo_baseurl | default('https://repo.middleware.biz/' ~ (yum_s3_bucket | default('corezoid')) ~ '/' ~ yum_s3_bucket_prefix) }}
      (rc={{ cz_preflight_location.rc }}, {{ cz_preflight_location.stderr | default('') | trim }}).
      Check corezoid_release / yum_s3_bucket_prefix and outbound HTTPS to repo.middleware.biz (the repository is IP-allowlisted: the host's egress IP must be on the Middleware allowlist).
    quiet: true

- name: Preflight | download the package header only
  ansible.builtin.get_url:
    url: "{{ cz_preflight_location.stdout_lines[-1] | trim }}"
    dest: "/tmp/cz-preflight-{{ corezoid_repo_preflight_package }}.rpm"
    mode: '0644'
    force: true
  register: cz_preflight_download

- name: Preflight | read signature digest from the RPM header
  ansible.builtin.command: >-
    rpm -qp --nosignature --qf '%{RSAHEADER:pgpsig} | %{SIGPGP:pgpsig}\n'
    /tmp/cz-preflight-{{ corezoid_repo_preflight_package }}.rpm
  register: cz_preflight_sig
  changed_when: false
  failed_when: false

- name: Preflight | remove the downloaded package
  ansible.builtin.file:
    path: "/tmp/cz-preflight-{{ corezoid_repo_preflight_package }}.rpm"
    state: absent

# An image without crypto-policies-scripts (minimal containers) still enforces the
# DEFAULT policy, so an empty answer is treated as DEFAULT.
- name: Preflight | derive verdict
  ansible.builtin.set_fact:
    cz_repo_sig: "{{ (cz_preflight_sig.stdout | default('')).split(' | ') | reject('equalto', '(none)') | first | default('unknown') }}"
    cz_repo_policy: "{{ (cz_preflight_policy.stdout | default('') | trim) or 'DEFAULT' }}"
    cz_repo_sig_sha1: "{{ 'SHA1' in (cz_preflight_sig.stdout | default('')) and 'SHA256' not in (cz_preflight_sig.stdout | default('')) }}"

- name: Preflight | policy verdict
  ansible.builtin.set_fact:
    cz_policy_rejects_sha1: "{{ cz_repo_policy.split(':')[0] in ['DEFAULT', 'FUTURE', 'FIPS'] and 'SHA1' not in cz_repo_policy }}"

- name: Preflight | report
  ansible.builtin.debug:
    msg: "aws-corezoid signature: {{ cz_repo_sig }}; host crypto policy: {{ cz_repo_policy }}"

- name: Preflight | apply SHA1-tolerant policy (EMERGENCY OVERRIDE corezoid_allow_sha1_policy=true)
  ansible.builtin.shell: |
    command -v update-crypto-policies >/dev/null || dnf -q -y install crypto-policies-scripts
    update-crypto-policies --set DEFAULT:SHA1
  when:
    - cz_repo_sig_sha1 | bool
    - cz_policy_rejects_sha1 | bool
    - corezoid_allow_sha1_policy | bool

- name: Preflight | warn about the weakened crypto policy
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} now runs crypto policy DEFAULT:SHA1 because the Corezoid
      repository ({{ corezoid_repo_baseurl | default(yum_s3_bucket_prefix) }}) is still RSA/SHA1-signed and corezoid_allow_sha1_policy=true.
      Revert with `update-crypto-policies --set DEFAULT` once the repository is re-signed with SHA256.
  when:
    - cz_repo_sig_sha1 | bool
    - cz_policy_rejects_sha1 | bool
    - corezoid_allow_sha1_policy | bool

- name: Preflight | stop before a SHA1-signed repository is used on a SHA1-rejecting host
  ansible.builtin.fail:
    msg: >-
      Corezoid packages in {{ corezoid_repo_baseurl | default(yum_s3_bucket_prefix) }} are signed with RSA/SHA1
      ({{ cz_repo_sig }}) and {{ inventory_hostname }} runs crypto policy '{{ cz_repo_policy }}',
      which rejects SHA1 signatures. dnf would fail with
      "warning: Signature not supported. Hash algorithm SHA1 not available. / Problem opening package ... /
      Error: GPG check FAILED" (rpm -Kv: "V4 RSA/SHA1 Signature, key ID 15b1a7e7: BAD").
      Fix: use a repository re-signed with SHA256 (corezoid_build_all/rpm-sign, os-matrix/sign-sha256) or,
      as a documented emergency override for this run only, set corezoid_allow_sha1_policy=true
      (applies `update-crypto-policies --set DEFAULT:SHA1` host-wide).
  when:
    - cz_repo_sig_sha1 | bool
    - cz_policy_rejects_sha1 | bool
    - not (corezoid_allow_sha1_policy | bool)
