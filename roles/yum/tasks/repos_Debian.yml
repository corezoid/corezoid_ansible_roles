---
# Debian/Ubuntu repo preflight (see roles/yum/tasks/main.yml).
# No Corezoid apt repo exists — this ensures 'universe' is enabled and the apt cache
# is fresh BEFORE system/atop install packages. Authoritative and fail-fast: if it
# cannot enable universe / refresh the cache it must fail here, not leave a host
# half-provisioned and fail cryptically later. Runs first (yum precedes system/atop).

- name: "Debian | initial apt cache refresh"
  ansible.builtin.apt:
    update_cache: true

- name: "Debian | ensure software-properties-common (provides add-apt-repository)"
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: "Debian | enable 'universe' component"
  ansible.builtin.command: add-apt-repository -y universe
  register: _universe_result
  changed_when: "'Adding' in _universe_result.stdout"
  tags:
    - yum-all
    - yum-debian-preflight

# Force a real refresh after changing sources — do NOT use cache_valid_time here,
# it could skip the update on a recently-refreshed cache and hide the new universe pkgs.
- name: "Debian | refresh apt cache after enabling universe"
  ansible.builtin.apt:
    update_cache: true
  tags:
    - yum-all
    - yum-debian-preflight
