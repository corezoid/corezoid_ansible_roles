---
# tasks file for rp (reverse proxy / nginx)

# Add the official nginx.org repository so we install the latest stable build
# rather than the much older distro-bundled package.
- name: Add official NGINX yum repository
  yum_repository:
    name: "nginx-{{ rp_nginx_repo_channel }}"
    description: "nginx {{ rp_nginx_repo_channel }} repo"
    baseurl: "{{ rp_nginx_repo_baseurl }}"
    gpgcheck: yes
    gpgkey: "{{ rp_nginx_repo_gpgkey }}"
    enabled: yes
    module_hotfixes: yes
  when: rp_use_official_repo | bool
  tags:
    - rp-all
    - rp-install
    - rp-repo

# Install NGINX. Empty rp_nginx_version installs the newest available; pin an
# exact version for reproducible deployments.
- name: Install NGINX
  yum:
    name: "nginx{{ ('-' + rp_nginx_version) if rp_nginx_version | length > 0 else '' }}"
    state: "{{ 'present' if rp_nginx_version | length > 0 else 'latest' }}"
    update_cache: yes
  notify: restart nginx
  tags:
    - rp-all
    - rp-install

# Standard directory layout for templated config and TLS material.
- name: Create NGINX directory structure
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "/etc/nginx/conf.d" }
    - { path: "{{ rp_snippets_dir }}" }
    - { path: "{{ rp_ssl_dir }}", mode: "0750" }
    - { path: "/var/log/nginx", owner: "{{ rp_user }}", group: "{{ rp_user }}" }
  tags:
    - rp-all
    - rp-config

# Remove the stock sample vhost so it cannot shadow our templated config.
- name: Remove default NGINX vhosts
  file:
    path: "/etc/nginx/conf.d/{{ item }}"
    state: absent
  loop:
    - "default.conf"
    - "virtual.conf"
    - "ssl.conf"
  notify: reload nginx
  tags:
    - rp-all
    - rp-config

# Main context configuration (nginx.conf): worker tuning, logging, gzip,
# rate-limit zones, real_ip, http defaults.
- name: Deploy main nginx.conf
  template:
    src: "nginx.conf.j2"
    dest: "/etc/nginx/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  tags:
    - rp-all
    - rp-config
    - rp-mainconfig

# Reusable snippets included by every TLS vhost.
- name: Deploy reusable config snippets
  template:
    src: "{{ item.src }}"
    dest: "{{ rp_snippets_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "snippets/ssl.conf.j2", dest: "ssl.conf" }
    - { src: "snippets/security.conf.j2", dest: "security.conf" }
    - { src: "snippets/proxy.conf.j2", dest: "proxy.conf" }
  notify: reload nginx
  tags:
    - rp-all
    - rp-config
    - rp-snippets

# Upstream definitions (only when the client declares any).
- name: Deploy upstreams configuration
  template:
    src: "upstreams.conf.j2"
    dest: "/etc/nginx/conf.d/00-upstreams.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  tags:
    - rp-all
    - rp-config
    - rp-upstreams

# Self-signed material so the catch-all TLS listener can start. Never served to
# real clients (no server_name matches the default server).
- name: Generate default-server self-signed certificate
  command: >
    openssl req -x509 -nodes -newkey rsa:2048 -days 3650
    -keyout {{ rp_ssl_dir }}/default_server.key
    -out {{ rp_ssl_dir }}/default_server.crt
    -subj "/CN=default_server"
  args:
    creates: "{{ rp_ssl_dir }}/default_server.crt"
  when: rp_default_server_drop | bool
  notify: reload nginx
  tags:
    - rp-all
    - rp-config

# NGINX log rotation. Overrides the stock /etc/logrotate.d/nginx so the policy
# is managed here and covers per-site *.log files in /var/log/nginx.
- name: Deploy NGINX logrotate configuration
  template:
    src: "logrotate.conf.j2"
    dest: "/etc/logrotate.d/nginx"
    owner: root
    group: root
    mode: "0644"
  when: rp_logrotate_enabled | bool
  tags:
    - rp-all
    - rp-config
    - rp-logrotate

# Optional catch-all default server returning 444 for unmatched Host headers.
- name: Deploy default-server guard
  template:
    src: "default_server.conf.j2"
    dest: "/etc/nginx/conf.d/00-default-server.conf"
    owner: root
    group: root
    mode: "0644"
  when: rp_default_server_drop | bool
  notify: reload nginx
  tags:
    - rp-all
    - rp-config

# Generate a self-signed certificate for any TLS site flagged ssl.self_signed
# whose cert is missing (handy for dev/test/first-run before real certs exist).
# Production sites simply omit the flag and ship real certificates.
- name: Generate self-signed certificate for flagged sites
  command: >
    openssl req -x509 -nodes -newkey rsa:2048 -days 365
    -keyout {{ item.ssl.certificate_key }}
    -out {{ item.ssl.certificate }}
    -subj "/CN={{ item.server_name.split(' ')[0] }}"
  args:
    creates: "{{ item.ssl.certificate }}"
  loop: "{{ rp_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.ssl is defined
    - item.ssl.enabled | default(false) | bool
    - item.ssl.self_signed | default(false) | bool
  notify: reload nginx
  tags:
    - rp-all
    - rp-config
    - rp-ssl

# One vhost file per declared site, rendered from the macro-driven template.
- name: Deploy reverse-proxy vhosts
  template:
    src: "vhost.conf.j2"
    dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ rp_sites }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    site: "{{ item }}"
  notify: reload nginx
  tags:
    - rp-all
    - rp-config
    - rp-vhosts

# Validate the assembled configuration. This runs before any handler reload,
# so an invalid template fails the play instead of breaking a live service.
- name: Validate NGINX configuration
  command: nginx -t
  register: rp_nginx_test
  changed_when: false
  tags:
    - rp-all
    - rp-config
    - rp-validate

- name: Enable and start NGINX
  service:
    name: nginx
    state: started
    enabled: yes
  tags:
    - rp-all
    - rp-service

# Explicitly verify the end state: the service must be running AND enabled on
# boot. Gives a clear, auditable failure instead of trusting the module alone.
- name: Gather service facts
  service_facts:
  tags:
    - rp-all
    - rp-service
    - rp-verify

- name: Assert NGINX is running and enabled on boot
  assert:
    that:
      - "'nginx.service' in ansible_facts.services"
      - "ansible_facts.services['nginx.service'].state == 'running'"
      - "ansible_facts.services['nginx.service'].status == 'enabled'"
    fail_msg: >-
      NGINX is not in the expected state — running:
      {{ ansible_facts.services['nginx.service'].state | default('absent') }},
      boot: {{ ansible_facts.services['nginx.service'].status | default('absent') }}
    success_msg: "NGINX is running and enabled on boot."
  tags:
    - rp-all
    - rp-service
    - rp-verify
