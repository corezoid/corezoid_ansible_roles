---
# handlers file for rp
#
# Config is always validated (nginx -t) by a task before any reload fires, so
# a bad template can never take the service down — the play stops first.

- name: reload nginx
  service:
    name: nginx
    state: reloaded
  tags:
    - rp-all

- name: restart nginx
  service:
    name: nginx
    state: restarted
  tags:
    - rp-all
