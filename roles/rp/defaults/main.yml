---
# defaults file for rp (reverse proxy / nginx)
#
# This role installs NGINX (latest stable from the official nginx.org repo by
# default) and renders configuration entirely from Jinja2 templates. It is
# designed to be reused across clients/environments: keep these defaults sane
# and override only what differs per client in the inventory's group_vars /
# host_vars (e.g. inventories/<client-env>/group_vars/rp.yml).

# ---------------------------------------------------------------------------
# Package / repository
# ---------------------------------------------------------------------------

# Pull NGINX from the official nginx.org repository so we always get the latest
# stable upstream build (the OS-bundled package lags far behind). Set to false
# to use whatever nginx the distro repos provide.
rp_use_official_repo: true

# nginx.org publishes packages per "centos" releasever. On RHEL/CentOS/Rocky
# this maps to the major version automatically. On Amazon Linux there is no
# matching path, so override rp_nginx_repo_releasever (e.g. "9" for AL2023,
# "7" for AL2) in inventory.
rp_nginx_repo_channel: "stable"            # "stable" or "mainline"
rp_nginx_repo_releasever: "{{ ansible_distribution_major_version }}"
rp_nginx_repo_baseurl: "http://nginx.org/packages/{{ 'mainline/' if rp_nginx_repo_channel == 'mainline' else '' }}centos/{{ rp_nginx_repo_releasever }}/$basearch/"
rp_nginx_repo_gpgkey: "https://nginx.org/keys/nginx_signing.key"

# Empty string installs the newest available version. Pin to an exact NVR
# (e.g. "1.26.2") for reproducible deployments.
rp_nginx_version: ""

# ---------------------------------------------------------------------------
# Global / main context tuning (best practice defaults)
# ---------------------------------------------------------------------------
rp_user: nginx
rp_worker_processes: "auto"
rp_worker_rlimit_nofile: 65535
rp_worker_connections: 16384
rp_multi_accept: "on"
rp_pid_file: "/var/run/nginx.pid"

rp_sendfile: "on"
rp_tcp_nopush: "on"
rp_tcp_nodelay: "on"
rp_keepalive_timeout: 65
rp_keepalive_requests: 1000
rp_types_hash_max_size: 4096
rp_types_hash_bucket_size: 64
rp_server_names_hash_bucket_size: 128
rp_server_tokens: "off"               # do not leak nginx version
rp_client_max_body_size: "16m"
rp_client_body_buffer_size: "16k"
rp_large_client_header_buffers: "4 16k"
rp_reset_timedout_connection: "on"
rp_client_body_timeout: 12
rp_client_header_timeout: 12
rp_send_timeout: 10

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
rp_access_log: "/var/log/nginx/access.log"
rp_error_log: "/var/log/nginx/error.log warn"
rp_log_format_name: "main"

# ---------------------------------------------------------------------------
# Log rotation (logrotate)
# Default policy: keep ~1 month of daily files; the most recent rotated file
# stays uncompressed and the rest are archived (gzip); anything beyond
# `rotate` is deleted. Override rp_logrotate_rotate per client to change the
# retention window.
# ---------------------------------------------------------------------------
rp_logrotate_enabled: true
rp_logrotate_path: "/var/log/nginx/*.log"
rp_logrotate_frequency: "daily"
rp_logrotate_rotate: 30           # keep ~1 month of daily logs, delete older
rp_logrotate_compress: true       # archive rotated logs (gzip)
rp_logrotate_delaycompress: true  # keep newest rotated file uncompressed
rp_logrotate_create_mode: "0640"
rp_logrotate_create_user: "{{ rp_user }}"
rp_logrotate_create_group: "root"

# ---------------------------------------------------------------------------
# Gzip
# ---------------------------------------------------------------------------
rp_gzip: "on"
rp_gzip_comp_level: 5
rp_gzip_min_length: 256
rp_gzip_types:
  - application/javascript
  - application/json
  - application/xml
  - text/css
  - text/plain
  - text/xml
  - image/svg+xml

# ---------------------------------------------------------------------------
# Real IP (when sitting behind a load balancer / ELB)
# ---------------------------------------------------------------------------
rp_real_ip_header: "X-Forwarded-For"
rp_set_real_ip_from:
  - "0.0.0.0/0"

# ---------------------------------------------------------------------------
# Rate limiting zones — declared once in http{}, referenced per-location.
# ---------------------------------------------------------------------------
rp_limit_req_zones:
  - { name: "perip", key: "$binary_remote_addr", size: "20m", rate: "100r/s" }
  - { name: "perip_strict", key: "$binary_remote_addr", size: "20m", rate: "15r/s" }
rp_limit_conn_zones:
  - { name: "addr", key: "$binary_remote_addr", size: "10m" }

# ---------------------------------------------------------------------------
# TLS / SSL best-practice defaults (Mozilla "intermediate")
# ---------------------------------------------------------------------------
rp_ssl_protocols: "TLSv1.2 TLSv1.3"
rp_ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
rp_ssl_prefer_server_ciphers: "off"
rp_ssl_session_cache: "shared:SSL:10m"
rp_ssl_session_timeout: "1d"
rp_ssl_session_tickets: "off"
rp_ssl_stapling: "off"                # set on (+ resolver) for public certs with OCSP
rp_ssl_dhparam: ""                    # path to dhparam file if generated

# HSTS header injected by the security snippet (empty disables it).
rp_hsts_header: "max-age=31536000; includeSubDomains"

# Default security response headers applied to every TLS server.
rp_security_headers:
  - { name: "X-Frame-Options", value: "SAMEORIGIN" }
  - { name: "X-Content-Type-Options", value: "nosniff" }
  - { name: "X-XSS-Protection", value: "1; mode=block" }
  - { name: "Referrer-Policy", value: "strict-origin-when-cross-origin" }

# Directory where the role keeps generated certs/snippets.
rp_ssl_dir: "/etc/nginx/ssl"
rp_snippets_dir: "/etc/nginx/snippets"

# ---------------------------------------------------------------------------
# Upstreams — keyed list rendered into upstreams.conf.
#   - name: app_backend
#     keepalive: 32
#     servers:
#       - "10.0.0.10:8080"
#       - { address: "10.0.0.11:8080", params: "weight=2 max_fails=3 fail_timeout=15s" }
# ---------------------------------------------------------------------------
rp_upstreams: []

# ---------------------------------------------------------------------------
# Virtual hosts / reverse-proxy sites — the heart of per-client config.
# See README.md for the full schema and macro-based custom locations.
# Empty by default so the role is inert until a client defines sites.
# ---------------------------------------------------------------------------
rp_sites: []

# Drop a default catch-all server returning 444 to swallow unmatched Host
# headers (common hardening practice). Disable if a client needs a real
# default server.
rp_default_server_drop: true
