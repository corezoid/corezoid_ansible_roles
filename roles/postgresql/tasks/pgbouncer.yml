# Install pgbouncer per OS family:
#   RedHat/Amazon -> pgbouncer_install_RedHat.yml (yum/rpm bodies, verbatim)
#   Debian/Ubuntu -> pgbouncer_install_Debian.yml (apt, universe)
- name: Install pgbouncer (per OS family)
  ansible.builtin.include_tasks:
    file: "pgbouncer_install_{{ ansible_os_family }}.yml"
    # Dynamic includes don't propagate the include's tags — apply explicitly.
    apply:
      tags:
        - pgsql-all
        - pgsql-pgbouncer
        - pgsql-pgbouncer-install
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-install

# Enable PgBouncer service
- name: Enable pgbouncer to survive reboot
  service: name={{ item }} enabled=yes
  with_items:
    - pgbouncer
  tags:
    - pgsql-all
    - pgsql-pgbouncer

# Generate password hashes for PgBouncer users
- name: Pgbouncer configuration, get hash for user - {{ db_app_user }}
  become: yes
  become_user: postgres
  shell: psql -p {{ db_main.port }} postgres -U postgres -Atc "select 'md5' || md5 ('{{ db_app_user_pass }}' || '{{ db_app_user }}')"
  register: db_app_user_hash
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-userlist

# Generate password hashes for PgBouncer users
- name: Pgbouncer configuration, get hash for user - {{ db_fdw_user }}
  become: yes
  become_user: postgres
  shell: psql -p {{ db_main.port }} postgres -U postgres -Atc "select 'md5' || md5 ('{{ db_fdw_user_pass }}' || '{{ db_fdw_user }}')"
  register: db_fdw_user_hash
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-userlist

# Generate password hashes for PgBouncer users
- name: Pgbouncer configuration, get hash for user - {{ db_monitoring_user }}
  become: yes
  become_user: postgres
  shell: psql -p {{ db_main.port }} postgres -U postgres -Atc "select 'md5' || md5 ('{{ db_monitoring_user_password }}' || '{{ db_monitoring_user }}')"
  register: db_monitoring_user_hash
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-userlist

# Configure PgBouncer — backend points at 127.0.0.1:{{ db_port }} (see template)
- name: Add pgbouncer.ini
  template:
    src: templates/pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    mode: 0644
  register: pgbouncer_ini
  tags:
    - pgsql-all
    - pgsql-pgbouncer

# Configure PgBouncer
- name: Creates systems directory for PgBouncer
  file:
    path: "/etc/systemd/system/pgbouncer.service.d"
    state: directory
    owner: root
    group: root
    mode: 0755
  when: >
    (
      (ansible_distribution == "CentOS" or ansible_distribution == "RedHat" or ansible_distribution == "OracleLinux" or ansible_distribution == "Amazon")
      and
      (ansible_distribution_major_version == "7" or ansible_distribution_major_version == "8" or ansible_distribution_major_version == "9" or ansible_distribution_major_version == "2023")
    )
    or ansible_os_family == "Debian"
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-systemd
    - pgsql-pgbouncer-limits

# Configure PgBouncer
- name: Add systemd limits.conf for PgBouncer
  template:
    src: "templates/{{ item }}.j2"
    dest: "/etc/systemd/system/pgbouncer.service.d/{{ item }}"
    mode: 0755
  with_items:
    - "limits.conf"
  when: >
    (
      (ansible_distribution == "CentOS" or ansible_distribution == "RedHat" or ansible_distribution == "OracleLinux" or ansible_distribution == "Amazon")
      and
      (ansible_distribution_major_version == "7" or ansible_distribution_major_version == "8" or ansible_distribution_major_version == "9" or ansible_distribution_major_version == "2023")
    )
    or ansible_os_family == "Debian"
  register: pgbouncer_systemd_file
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-systemd
    - pgsql-pgbouncer-limits

# Configure PgBouncer
- name: Reload systemd-daemon if pgbouncer_systemd_file changed
  service:
    # name: pgbouncer
    # state: reloaded
    daemon_reload: yes
  when: pgbouncer_systemd_file.changed
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-systemd
    - pgsql-pgbouncer-limits

# Configure PgBouncer
# userlist owner is family-gated: the Debian pgbouncer package has NO 'pgbouncer'
# user and runs as 'postgres'; RHEL keeps 'pgbouncer'.
- name: Add userlist.txt
  template:
    src: templates/userlist.txt.j2
    dest: /etc/pgbouncer/userlist.txt
    mode: 0600
    owner: "{{ 'postgres' if ansible_os_family == 'Debian' else 'pgbouncer' }}"
  register: pgbouncer_userlist
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-userlist

# Start PgBouncer service
- name: Start pgbouncer service
  service: name={{ item }} state=started
  with_items:
    - pgbouncer
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-start

# The Debian pgbouncer package auto-starts on install with its DEFAULT config
# (127.0.0.1:6432), so a plain `state: started` is a no-op and our pgbouncer.ini /
# userlist.txt never take effect. Restart when any of them (or the systemd drop-in) changed
# so the configured listen_addr/port (0.0.0.0:{{ pgbouncer.port }}) and userlist load.
- name: Restart pgbouncer if config changed
  service:
    name: pgbouncer
    state: restarted
  when: >
    (pgbouncer_ini is defined and pgbouncer_ini.changed)
    or (pgbouncer_userlist is defined and pgbouncer_userlist.changed)
    or (pgbouncer_systemd_file is defined and pgbouncer_systemd_file.changed)
  tags:
    - pgsql-all
    - pgsql-pgbouncer
    - pgsql-pgbouncer-start
