---
# Guardrail: this role now supports RedHat/Amazon (unchanged) and Debian/Ubuntu.
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: "postgresql role supports only RedHat/Debian families, got '{{ ansible_os_family }}'"
    quiet: true
  tags:
    - pgsql-all
    - pgsql-assert

# Add the PostgreSQL repository configuration (RedHat/Amazon only).
# STATIC import_tasks (not include_tasks): the file name is static and its inner tasks carry legacy
# `postgresql-*` tags that operators select directly (e.g. --tags postgresql-maintenance-cron). A
# static import keeps those inner tags reachable; a dynamic include would hide them unless the
# include task itself were selected. `when` propagates to all imported tasks (RedHat-only, unchanged).
- name: Add PostgreSQL Repo (RedHat/Amazon)
  ansible.builtin.import_tasks: add_repo.yml
  when: ansible_os_family == "RedHat"
  tags:
    - pgsql-all
    - pgsql-init

# Initial PostgreSQL install + setup (RedHat/Amazon only) — static import for the same tag-reachability
# reason (install.yml carries maintenance/cron/install `postgresql-*` tags used for selective runs).
- name: First run (RedHat/Amazon)
  ansible.builtin.import_tasks: install.yml
  when: ansible_os_family == "RedHat"
  tags:
    - pgsql-all
    - pgsql-init

# Debian/Ubuntu: PGDG apt repo + install + relocated cluster on {{ db_port }} +
# listen/pg_hba + replication readiness (phase 1). Mirrors the RedHat repo+install split.
- name: Debian setup (repo + install + cluster + replication prereqs)
  ansible.builtin.include_tasks:
    file: install_Debian.yml
    apply:
      tags:
        - pgsql-all
        - pgsql-init
  when: ansible_os_family == "Debian"
  tags:
    - pgsql-all
    - pgsql-init

# Set appropriate psycopg2 package for Amazon Linux
- name: Set psycopg2 package name for Amazon Linux
  set_fact:
    psycopg2_rpm: "python-psycopg2"
  when: ansible_distribution == "Amazon"
  tags:
    - pgsql-all
    - pgsql-install-deps

# Set appropriate psycopg2 package for RHEL/CentOS/OracleLinux 7 and 9
- name: Set psycopg2 package name for RHEL/CentOS/OracleLinux 7
  set_fact:
    psycopg2_rpm: "python-psycopg2"
  when:
    - ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS' or ansible_distribution == "OracleLinux"
    - ansible_distribution_major_version == "7" or ansible_distribution_major_version == "9"
  tags:
    - pgsql-all
    - pgsql-install-deps

# Set appropriate psycopg2 package for RHEL/CentOS/OracleLinux 8
- name: Set psycopg2 package name for RHEL/CentOS/OracleLinux 8
  set_fact:
    psycopg2_rpm: "python3-psycopg2"
  when:
    - ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS' or ansible_distribution == "OracleLinux"
    - ansible_distribution_major_version == "8"
  tags:
    - pgsql-all
    - pgsql-install-deps

# Display the selected psycopg2 package and distribution information
- debug: msg="{{ psycopg2_rpm }} - {{ ansible_distribution }} - {{ ansible_distribution_major_version }}"
  when: psycopg2_rpm is defined
  tags:
    - pgsql-all
    - pgsql-install-deps
    - pgsql-install-deps-debug

# Install the psycopg2 package with retry logic
- name: Install packages psycopg2 for RHEL/CentOS/OracleLinux 7
  yum: name={{ item }} state=present update_cache=yes
  retries: 3
  delay: 5
  with_items:
    - "{{ psycopg2_rpm }}"
  when:
    - psycopg2_rpm is defined
  tags:
    - pgsql-all
    - pgsql-install-deps

# Debian/Ubuntu: psycopg2 (required by the postgresql_* Ansible modules) via apt
- name: Install python3-psycopg2 for Debian
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  tags:
    - pgsql-all
    - pgsql-install-deps

