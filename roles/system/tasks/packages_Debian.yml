---
# Debian/Ubuntu base packages. Mirrors the RHEL best-effort semantics:
# one package at a time with failed_when: false so a missing/renamed package
# degrades gracefully instead of aborting base provisioning across all hosts.
# The apt cache / universe preflight is done earlier by the yum role.
- name: Install base packages one by one (Debian)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_base_packages_debian }}"
  register: package_result_debian
  failed_when: false
  tags:
    - system-all
    - system-rpm
