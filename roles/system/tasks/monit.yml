---
# Monit setup. Install + main config file diverge per OS family (bundled RPM +
# /etc/monit.conf on RHEL, apt + /etc/monit/monitrc on Debian); the include dir,
# state dir and service start are shared. See docs/plans/ubuntu-base-roles-plan.md.

- name: Install and configure monit (per OS family)
  ansible.builtin.include_tasks:
    file: "monit_{{ ansible_os_family }}.yml"
    # Propagate tags to inner tasks (dynamic include). Without this a
    # --tags system-monit run would skip the RHEL install/copy tasks (which
    # carry only redis-* tags) and then fail starting a missing monit service.
    apply:
      tags:
        - system-all
        - system-monit
        - system-monit-config
        - system-monit-install
  tags:
    - system-all
    - system-monit
    - system-monit-config
    - system-monit-install

# Downstream service roles (redis, elasticsearch, capi, worker, ...) drop their
# Monit fragments into /etc/monit.d, and the monit config includes /etc/monit.d/*.
# The dir must exist on BOTH families or those roles break. Do NOT switch to
# Debian's native /etc/monit/conf.d without migrating every producing role at once.
- name: Create monit include directory
  file:
    path: /etc/monit.d
    state: directory
    owner: root
    group: root
    mode: 0755
  tags:
    - system-all
    - system-monit
    - system-monit-dirs

- name: Create monit directory
  file:
    path: /var/monit
    state: directory
    mode: 0755
    owner: root
    group: root
  tags:
    - system-all
    - system-monit
    - system-monit-dirs

- name: Create monit id file
  file:
    path: /var/monit/id
    owner: root
    group: root
    mode: 0600
    state: touch
  tags:
    - system-all
    - system-monit
    - system-monit-dirs

- name: Start monit services
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  with_items:
    - "monit"
  tags:
    - system-all
    - system-monit
    - system-monit-service
