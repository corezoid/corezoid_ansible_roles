---
# defaults file for system

# Base packages installed on Debian/Ubuntu hosts (RHEL uses its own list in
# tasks/packages_RedHat.yml). Kept as a var so envs can override. Names are the
# Debian equivalents of the RHEL base set; universe must be enabled (yum role
# preflight handles that).
system_base_packages_debian:
  - bind9-dnsutils   # dig / nslookup (RHEL: bind-utils)
  - mc
  - atop
  - htop
  - iotop
  - iftop
  - wget
  - lsof
  - screen
  - mlocate
  - netcat-openbsd   # RHEL: nc
  - mtr-tiny         # RHEL: mtr
  - tcpdump
  - pigz
  - pwgen
  - vim
  - net-tools
  - jq
  - bash-completion
  - cron             # RHEL: cronie
  - sysstat
