---
# defaults file for rabbitmq

rabbitmq_config_file_path: "/etc/rabbitmq/rabbitmq.config"
rabbitmq_config_file_owner: root
rabbitmq_config_file_group: rabbitmq
rabbitmq_config_file_mode: 0644

# system number of open files
rabbitmq_service_d_path: /etc/systemd/system/rabbitmq-server.service.d
rabbitmq_system_number_open_files: 512000

rabbitmq_users_remove:
  - guest

rabbitmq_erlang_cookie_file_path: "/var/lib/rabbitmq/.erlang.cookie"

rmq_vhost: "/conveyor"
rmq_vhost_gitcall: "/gitcall"
rmq_vhost_dundergitcall: "/dundergitcall"
rmq_vhost_dbcall: "/dbcall"

# Safe default so the cluster tasks' `| bool` filter never errors when a caller only
# wants single-node install (Phase 1) without setting rabbitmq_create_cluster/-master/-nodes.
rabbitmq_create_cluster: false

# --- Debian/Ubuntu install (tasks/install_Debian.yml) ---
# Team RabbitMQ's current apt repos (ppa1/ppa2.rabbitmq.com were retired 2025-11-01;
# these deb1/deb2 hosts are the live replacement). Key fetched by fingerprint from the
# SKS/OpenPGP keyserver network, matching RabbitMQ's own migration instructions.
rabbitmq_apt_key_url: "https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA"
rabbitmq_apt_erlang_repo_1: "https://deb1.rabbitmq.com/rabbitmq-erlang"
rabbitmq_apt_erlang_repo_2: "https://deb2.rabbitmq.com/rabbitmq-erlang"
rabbitmq_apt_server_repo_1: "https://deb1.rabbitmq.com/rabbitmq-server"
rabbitmq_apt_server_repo_2: "https://deb2.rabbitmq.com/rabbitmq-server"

# Debian package revision suffixes for the pinned versions (rmq_erl_version/rmq_version come
# from box.yml). Confirmed present on the apt repo at implementation time (2026-07-09):
# erlang-base 1:26.0.2-1, rabbitmq-server 3.12.2-1 for jammy/amd64.
rabbitmq_deb_erlang_revision: "1"
rabbitmq_deb_server_revision: "1"

# Minimal Erlang subset Team RabbitMQ recommends (avoids the full `erlang` metapackage's
# superset, e.g. wx/observer/debugger GUI deps not needed on a headless broker).
rabbitmq_erlang_packages_debian:
  - erlang-base
  - erlang-asn1
  - erlang-crypto
  - erlang-eldap
  - erlang-ftp
  - erlang-inets
  - erlang-mnesia
  - erlang-os-mon
  - erlang-parsetools
  - erlang-public-key
  - erlang-runtime-tools
  - erlang-snmp
  - erlang-ssl
  - erlang-syntax-tools
  - erlang-tftp
  - erlang-tools
  - erlang-xmerl
