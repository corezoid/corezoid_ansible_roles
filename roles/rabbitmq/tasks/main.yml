# This playbook handles RabbitMQ installation and configuration across different OS distributions
# Main supported distributions: CentOS, RedHat, OracleLinux, and Amazon Linux\

# Display all OS information for debugging
# Shows the current OS distribution, version and architecture details of the target system
- name: Debug OS information
  debug:
    msg:
      - "Distribution: {{ ansible_distribution }}"
      - "Version: {{ ansible_distribution_major_version }}"
      - "Architecture: {{ ansible_architecture }}"
      - "Full string: {{ ansible_distribution }}-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}"

# Verify Rabbit version before installation
# Validates that only the supported Rabbit version 3.12.2 is being installed
- name: Verify versions
  fail:
    msg: |
      Version verification failed:
      - RabbitMQ: Only 3.12.2 is supported. Current: {{ rmq_version }}
      - Erlang: Only 26.0.2 is supported. Current: {{ rmq_erl_version }}
  when: rmq_version != "3.12.2" or rmq_erl_version != "26.0.2"

# Family split: package acquisition is the only RHEL/Debian divergence in this role
# (everything below "copy erlang cookie" is portable). RHEL body moved verbatim to
# install_RedHat.yml; Debian/Ubuntu uses Team RabbitMQ's apt repos (install_Debian.yml).
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: "rabbitmq role supports only RedHat/Debian, got '{{ ansible_os_family }}'"
    quiet: true

    # `apply.tags` is required, not just the `tags:` on the include itself: dynamic
    # `include_tasks` tags do NOT propagate to tasks inside the included file (confirmed
    # empirically) — without `apply`, `--tags rabbit-install` would walk into this include
    # but then skip every untagged task inside install_Debian.yml/install_RedHat.yml.
- name: Install RabbitMQ + Erlang (RedHat/Amazon)
  include_tasks:
    file: install_RedHat.yml
    apply:
      tags:
        - rabbit-all
        - rabbit-install
  when: ansible_os_family == 'RedHat'
  tags:
    - rabbit-all
    - rabbit-install

- name: Install RabbitMQ + Erlang (Debian/Ubuntu)
  include_tasks:
    file: install_Debian.yml
    apply:
      tags:
        - rabbit-all
        - rabbit-install
  when: ansible_os_family == 'Debian'
  tags:
    - rabbit-all
    - rabbit-install

# Configure Erlang cookie for cluster authentication.
# On Debian, `apt install rabbitmq-server` (the package task above) auto-starts the broker via a
# postinst trigger BEFORE this task ever runs — the already-running BEAM VM loads whatever cookie is
# on disk at that moment (an auto-generated one) into memory, and Erlang never re-reads
# .erlang.cookie live. Left uncorrected, this task can rewrite the FILE while the RUNNING node keeps
# authenticating with the old in-memory value forever, and every rabbitmqctl call below fails with
# "Erlang distribution failed" even though the file on disk is right (confirmed via timestamps: on
# ff_kyrgyztan_prod_hl the broker process started ~1 minute before this task first wrote the cookie).
# `register` + the plain (non-handler) restart task further down fixes this only where
# rmq_restart_on_cookie_change is explicitly set (see ansible/inventories/ff_kyrgyztan_prod_hl/cz-init.yml)
# — a handler+flush_handlers approach was tried and rejected on adversarial review: flush_handlers is
# play-global (would force-run any OTHER role's already-notified handler early, e.g. yum/atop in
# shared plays) and untagged (invisible under selective --tags runs). A normal tagged task keyed off
# these `register` results avoids both problems. Existing RHEL clients are untouched either way
# (`yum install` does not auto-start services the way Debian's dpkg postinst does, which is likely
# why this was never hit before).
- name: copy erlang cookie
  template:
    src: erlang.cookie.j2
    dest: "{{ rabbitmq_erlang_cookie_file_path }}"
    owner: rabbitmq
    group: rabbitmq
    mode: 0400
    backup: yes
  register: rmq_cookie_copy_result
  tags:
    - rabbitmq-all
    - rabbitmq-install
    - rabbitmq-install-cookie

# Every rabbitmq_vhost/rabbitmq_user/rabbitmq_policy task below shells out to rabbitmqctl as
# whatever user this play's `become` runs as (root, since no become_user is set here) — root needs
# its OWN matching cookie to authenticate to the running node. Without this, rabbitmqctl gets a
# freshly-generated random cookie in root's homedir on first-ever invocation and every rabbitmqctl
# call fails with "TCP connection succeeded but Erlang distribution failed" (cookie mismatch), even
# though the broker itself is up and healthy.
- name: copy erlang cookie for root (rabbitmqctl runs as root via become)
  template:
    src: erlang.cookie.j2
    dest: /root/.erlang.cookie
    owner: root
    group: root
    mode: 0400
    backup: yes
  register: rmq_cookie_copy_root_result
  tags:
    - rabbitmq-all
    - rabbitmq-install
    - rabbitmq-install-cookie

# Deploy RabbitMQ configuration for non-autoscaling setup
- name: copy the rabbitmq configuration file
  template:
    src: rabbitmq.config.j2
    dest: "{{ rabbitmq_config_file_path }}"
    owner: "{{ rabbitmq_config_file_owner }}"
    group: "{{ rabbitmq_config_file_group }}"
    mode: "{{ rabbitmq_config_file_mode }}"
    backup: yes
  register: rmq_config_copy_result
  tags:
    - rabbitmq-all
    - rabbitmq-set-pass

# Configure system limits for file handles. Path is a distro-agnostic systemd drop-in
# (/etc/systemd/system/rabbitmq-server.service.d/limits.conf), so this now applies on
# both families; the original gate was RHEL-7/8-only (and buggy operator precedence),
# which silently skipped Ubuntu — widened here so Debian/Ubuntu also gets LimitNOFILE.
- name: alter number of system's open file if rabbitmq_system_number_open_files is set
  block:
    - name: make sure service.d exists
      file:
        path: "{{ rabbitmq_service_d_path }}"
        state: directory

    - name: change limit of system's number of open file
      template:
        src: limits.conf.j2
        dest: "{{ rabbitmq_service_d_path }}/limits.conf"
        backup: true
  when: rabbitmq_system_number_open_files is defined
  tags:
    - rabbitmq-all
    - rabbitmq-set-pass

# Debug admin password
- name: current rmq_admin_pass
  debug: msg={{ rmq_admin_pass }}
  tags:
    - rabbitmq-all
    - rabbitmq-set-pass-debug

# Configure RabbitMQ plugins
- name: setup RabbitMQ plugins list
  template: src=templates/enabled_plugins.j2 dest=/etc/rabbitmq/enabled_plugins owner=root group=root mode=0644
  tags:
    - rabbitmq-all
    - rabbitmq-enable-plugins

# Enable RabbitMQ service and start it
- name: enable rabbitmq-server to survive reboot
  service: name=rabbitmq-server state=started enabled=yes
  tags:
    - rabbitmq-all
    - rabbitmq-enable-autostart

# Plain tagged task (not a handler+flush_handlers — rejected on adversarial review: flush_handlers
# is play-global and untagged, so it would force-run any OTHER role's already-notified handler early
# in shared plays, and vanish under selective --tags runs). Gated on rmq_restart_on_cookie_change
# (HL-only opt-in, see the "copy erlang cookie" comment above) AND on whether the cookie/config
# actually changed — so on every other client (gate unset) and on any stable HL rerun (nothing
# changed) this is a no-op, exactly like the tasks whose `register` results it checks. `is defined`
# guards on each register (adversarial review finding): a selective --tags run can skip any subset of
# the three producer tasks, so their result vars may not exist at all — dereferencing `.changed`
# directly would fail the play with an undefined-variable error instead of just skipping. Tagged with
# every producer task's tag (including rabbitmq-install-cookie) so this restart is reachable whenever
# ANY of them would run, not just when all three do.
- name: restart rabbitmq-server (cookie/config changed, opt-in only — picks up corrected in-memory state)
  service:
    name: rabbitmq-server
    state: restarted
  when:
    - rmq_restart_on_cookie_change | default(false) | bool
    - >
      (rmq_cookie_copy_result is defined and rmq_cookie_copy_result.changed) or
      (rmq_cookie_copy_root_result is defined and rmq_cookie_copy_root_result.changed) or
      (rmq_config_copy_result is defined and rmq_config_copy_result.changed)
  tags:
    - rabbitmq-all
    - rabbitmq-install
    - rabbitmq-install-cookie
    - rabbitmq-set-pass

# Create required virtual hosts
- name: ensure vhost is present
  rabbitmq_vhost:
    name: "{{ item }}"
    state: present
  with_items:
    - "{{ rmq_vhost }}"
    - "{{ rmq_vhost_gitcall }}"
    - "{{ rmq_vhost_dbcall }}"
    - "{{ rmq_vhost_dundergitcall }}"
  tags:
    - rabbitmq-all
    - rabbitmq-add-vhost

# Add admin user with full privileges to all vhosts
# Uses administrator tag for management UI access
- name: add admin users
  rabbitmq_user:
    user: "{{ item.login }}"
    password: "{{ item.pass }}"
    tags: "administrator,management"
    vhost: "{{ item.vhost }}"
    configure_priv: .*
    write_priv: .*
    read_priv: .*
    state: present
  with_items:
    - { "login": "admin", "pass": "{{ rmq_admin_pass }}", "vhost": "{{ rmq_vhost }}" }
    - { "login": "admin", "pass": "{{ rmq_admin_pass }}", "vhost": "{{ rmq_vhost_gitcall }}" }
    - { "login": "admin", "pass": "{{ rmq_admin_pass }}", "vhost": "{{ rmq_vhost_dbcall }}" }
    - { "login": "admin", "pass": "{{ rmq_admin_pass }}", "vhost": "{{ rmq_vhost_dundergitcall }}" }
  no_log: true
  tags:
    - rabbitmq-all
    - rabbitmq-add-users
    - rabbitmq-add-admin

# Add conveyor_gc admin user to main vhost
# Special purpose user for system operations
- name: add conveyor_gc user
  rabbitmq_user:
    user: "{{ item.login }}"
    password: "{{ item.pass }}"
    tags: "administrator,management"
    vhost: "{{ item.vhost }}"
    configure_priv: .*
    write_priv: .*
    read_priv: .*
    state: present
  with_items:
    - { "login": "conveyor_gc", "pass": "{{ rmq_app_user_pass_enc }}", "vhost": "{{ rmq_vhost }}" }
  no_log: true
  tags:
    - rabbitmq-all
    - rabbitmq-add-users
    - rabbitmq-add-conveyor_gc

# Add application users to all vhosts
# Full permissions but no management access
- name: add app users
  rabbitmq_user:
    user: "{{ item.login }}"
    password: "{{ item.pass }}"
    vhost: "{{ item.vhost }}"
    configure_priv: .*
    write_priv: .*
    read_priv: .*
    state: present
  with_items:
    - { "login": "{{ rmq_user }}", "pass": "{{ rmq_user_pass }}", "vhost": "{{ rmq_vhost }}" }
    - { "login": "{{ rmq_user }}", "pass": "{{ rmq_user_pass }}", "vhost": "{{ rmq_vhost_gitcall }}" }
    - { "login": "{{ rmq_user }}", "pass": "{{ rmq_user_pass }}", "vhost": "{{ rmq_vhost_dbcall }}" }
    - { "login": "{{ rmq_user }}", "pass": "{{ rmq_user_pass }}", "vhost": "{{ rmq_vhost_dundergitcall }}" }
  no_log: true
  tags:
    - rabbitmq-all
    - rabbitmq-add-users

# Remove deprecated users from the system
- name: ensure the trash users are removed
  rabbitmq_user:
    user={{ item }}
    state=absent
  with_items: "{{ rabbitmq_users_remove }}"
  tags:
    - rabbitmq-all
    - rabbitmq-set-pass

# Enable management UI plugin for non-autoscale deployments
- name: ensure rabbitmq_management is enabled
  rabbitmq_plugin:
    names: rabbitmq_management
    state: enabled
  tags:
    - rabbitmq-all
    - rabbitmq-plugins

# Set HA policy for main vhost
# All queues mirrored to all nodes
- name: Ensure the conveyor vhost contains the HA policy
  rabbitmq_policy:
    name: ha-all
    pattern: .*
    vhost: "{{ item }}"
    priority: "0"
  args:
    tags:
      ha-mode: all
  with_items:
    - "{{ rmq_vhost }}"
  tags:
    - rabbitmq-all
    - rabbitmq-policy

# Set HA policy for gitcall vhosts
# Mirror all queues across cluster
- name: Ensure the gitcall vhost contains the HA policy
  rabbitmq_policy:
    name: "ha-all-{{ item }}"
    pattern: .*
    vhost: "/{{ item }}"
    priority: "0"
  args:
    tags:
      ha-mode: all
  with_items:
    - "gitcall"
    - "dundergitcall"
  tags:
    - rabbitmq-all
    - rabbitmq-policy

# Update hosts file on all nodes
- name: Add RabbitMQ nodes to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.hostname }}"
    state: present
  with_items: "{{ rabbitmq_cluster_nodes }}"
  when: rabbitmq_create_cluster | bool
  tags:
    - rabbitmq-cluster

# Check required ports before cluster setup
- name: Check RabbitMQ ports connectivity to master node
  wait_for:
    host: "{{ hostvars[rabbitmq_cluster_master]['ansible_host'] | default(hostvars[rabbitmq_cluster_master]['ansible_ssh_host'], true) | default(rabbitmq_cluster_master) }}"
    port: "{{ item }}"
    state: started
    timeout: 5
  with_items:
    - 4369  # epmd
    - 5672  # AMQP
    - 15672 # Management UI
  when:
    - rabbitmq_create_cluster | bool
    - inventory_hostname != rabbitmq_cluster_master
  register: port_check
  ignore_errors: true
  tags:
    - rabbitmq-cluster

# Fail if ports are not accessible
- name: Fail if ports are not accessible
  fail:
    msg: "Required ports (4369, 5672, 15672) are not accessible on master node {{ rabbitmq_cluster_master }}"
  when:
    - rabbitmq_create_cluster | bool
    - inventory_hostname != rabbitmq_cluster_master
    - port_check is failed
  tags:
    - rabbitmq-cluster

# Configure cluster on secondary nodes
- name: Configure RabbitMQ cluster
  block:
    - name: Stop RabbitMQ app
      command: rabbitmqctl stop_app

    - name: Reset RabbitMQ
      command: rabbitmqctl reset

    - name: Join RabbitMQ cluster
      command: "rabbitmqctl join_cluster rabbit@{{ rabbitmq_cluster_master }}"

    - name: Start RabbitMQ app
      command: rabbitmqctl start_app

    - name: Check cluster status
      command: rabbitmqctl cluster_status
      register: cluster_status

    - name: Debug cluster status
      debug:
        var: cluster_status.stdout_lines
  when:
    - rabbitmq_create_cluster | bool
    - ansible_hostname != rabbitmq_cluster_master
  tags:
    - rabbitmq-cluster