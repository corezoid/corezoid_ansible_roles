# RHEL/CentOS/OracleLinux/Amazon install path — moved VERBATIM from tasks/main.yml
# (yum repo + java + elasticsearch + nginx). Byte-for-byte with the pre-port role.

# Configure Elasticsearch repository
# Sets up the repository configuration for the specified Elasticsearch version
- name: Add Elasticsearch repo
  template:
    src: templates/{{ elasticsearch.version }}-elasticsearch.repo.j2
    dest: /etc/yum.repos.d/elasticsearch.repo
  tags:
    - elasticsearch-all
    - elasticsearch-install
    - elasticsearch-repo-install

# Clean YUM cache
# Ensures fresh package metadata for installation
- name: Yum clean all
  command: yum clean all
  tags:
    - elasticsearch-all
    - elasticsearch-install

# Install Java for Amazon Linux 2
# Sets up OpenJDK 11 using amazon-linux-extras
- name: Install Java
  shell: amazon-linux-extras install java-openjdk11 -y
  tags:
    - elasticsearch-all
    - elasticsearch-install
  when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2"

# Install Java for Amazon Linux 2023
# Sets up Java 11 using standard package manager
- name: Install Java AMI3
  shell: yum install java-11 -y
  tags:
    - elasticsearch-all
    - elasticsearch-install
  when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2023"

# Install Java for RedHat-based systems
# Sets up OpenJDK 11 for CentOS/RHEL/Oracle Linux
- name: Install Java
  yum:
    name: "{{ item }}"
    state: present
    update_cache: yes
  with_items:
    - "java-11-openjdk"
    - "java-11-openjdk-headless"
  tags:
    - elasticsearch-all
    - elasticsearch-install
  when:
    - ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon'
    - ansible_distribution_major_version in ["7", "8", "9"]

# Crypto policy DEFAULT:SHA1 on EL9.
# Historically added here; its real effect was to let the SHA1-signed Corezoid RPMs install
# on hosts where this role ran before the app roles. Package signing is moving to SHA256
# (corezoid_build_all/rpm-sign, os-matrix/sign-sha256) and roles/yum now has an explicit,
# documented override (corezoid_allow_sha1_policy). This task is therefore opt-in:
# elasticsearch_set_sha1_policy defaults to false. Set it to true only if an EL9 host
# still needs SHA1 for the Elasticsearch repository itself.
- name: update-crypto-policies DEFAULT:SHA1 on EL9 (opt-in, elasticsearch_set_sha1_policy)
  shell: update-crypto-policies --set DEFAULT:SHA1
  when:
    - elasticsearch_set_sha1_policy | default(false) | bool
    - ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon'
    - ansible_distribution_major_version == "9"

# Install Elasticsearch package
# Installs the specified version of Elasticsearch from configured repository
- name: Install elasticsearch packages
  yum:
    name: "{{ item }}"
    state: present
    update_cache: yes
    disablerepo: "*"
    enablerepo: "elasticsearch*"
  with_items:
    - "elasticsearch-{{ elasticsearch.version }}.*"
  notify:
    - restart elasticsearch
  tags:
    - elasticsearch-all
    - elasticsearch-install

# Install Nginx web server
# Sets up Nginx for proxying Elasticsearch requests
- name: Install nginx packages
  yum:
    name: "{{ item }}"
    state: present
    update_cache: yes
  with_items:
    - "nginx"
  notify:
    - restart elasticsearch
  tags:
    - elasticsearch-all
    - elasticsearch-install
