---
# Family split: package acquisition (repo + java + elasticsearch + nginx) is the only
# RHEL/Debian divergence in this role (everything below "Create main Elasticsearch
# directory" is portable). RHEL body moved verbatim to install_RedHat.yml; Debian/Ubuntu
# uses Elastic's apt repo + distro nginx (install_Debian.yml).
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: "elasticsearch role supports only RedHat/Debian, got '{{ ansible_os_family }}'"
    quiet: true
  tags: [elasticsearch-all, elasticsearch-install]

# Tags on a dynamic `include_tasks` gate whether Ansible walks into the file at all — unlike
# `import_tasks`, they are NOT reliably inherited by tasks inside it (confirmed empirically),
# so the include must ALSO carry `apply.tags`, or a targeted `--tags elasticsearch-repo-install`
# run (an existing tag on the RHEL repo task, preserved verbatim in install_RedHat.yml) would
# silently skip the whole include. IMPORTANT: `apply.tags` is unioned onto EVERY task in the
# included file (confirmed empirically) — it must therefore hold only the tags common to every
# task (elasticsearch-all/-install), NOT the narrower elasticsearch-repo-install tag, or every
# task in install_RedHat.yml (java, crypto-policies, nginx install, ...) would incorrectly
# start matching a `--tags elasticsearch-repo-install` run too. The narrow tag stays only on
# the include's own `tags:` (so the walk-in happens) and on the repo task's own literal tag
# (unchanged, preserved verbatim) so only that one task actually matches the narrow filter.
- name: RedHat/Amazon install (repo + java + elasticsearch + nginx)
  include_tasks:
    file: install_RedHat.yml
    apply:
      tags: [elasticsearch-all, elasticsearch-install]
  when: ansible_os_family == 'RedHat'
  tags: [elasticsearch-all, elasticsearch-install, elasticsearch-repo-install]

- name: Debian install (apt repo + elasticsearch + nginx)
  include_tasks:
    file: install_Debian.yml
    apply:
      tags: [elasticsearch-all, elasticsearch-install]
  when: ansible_os_family == 'Debian'
  tags: [elasticsearch-all, elasticsearch-install, elasticsearch-repo-install]

# Create main Elasticsearch directory
# Sets up the primary directory structure with proper permissions
- name: Creates main directory for Elasticsearch
  file:
    path: "{{ top_dir }}/{{ elasticsearch.es_main_dir }}"
    state: directory
    owner: "{{ elasticsearch.es_dir_owner }}"
    group: "{{ elasticsearch.es_dir_owner }}"
    mode: 0775
    recurse: yes
  tags:
    - elasticsearch-all
    - elasticsearch-install
    - elasticsearch-install-main-dir

# Generate Elasticsearch configuration
# Creates the main Elasticsearch configuration from template
- name: Create Elasticsearch Config
  template:
    src: "templates/{{ elasticsearch.version }}-{{ item }}.yml.j2"
    dest: "/etc/{{ item }}/{{ item }}.yml"
    owner: "{{ elasticsearch.es_dir_owner }}"
    group: "{{ elasticsearch.es_dir_owner }}"
    mode: 0750
  with_items:
    - elasticsearch
  tags:
    - elasticsearch-all
    - elasticsearch-install
  register: elasticsearch_conf_changed

# Creates the main Elasticsearch JVM options from template
- name: Configure JVM options
  template:
    src: templates/jvm.options.j2
    dest: /etc/elasticsearch/jvm.options
    owner: root
    group: elasticsearch
    mode: '0660'
  tags:
    - elasticsearch-all
    - elasticsearch-jvm-config
  register: elasticsearch_conf_changed
  
# Create Elasticsearch subdirectories
# Sets up required subdirectories for work, data, and plugins
- name: Creates directories for Elasticsearch
  with_items:
    - work
    - data
    - plugins
  file:
    path: "{{ top_dir }}/{{ elasticsearch.es_main_dir }}/{{ item }}"
    state: directory
    owner: "{{ elasticsearch.es_dir_owner }}"
    group: "{{ elasticsearch.es_dir_owner }}"
    mode: 0775
    recurse: yes
  tags:
    - elasticsearch-all
    - elasticsearch-install

# Remove default Nginx configurations
# Cleans up default Nginx configuration files
- name: Nginx delete default configs
  file:
    path: "/etc/nginx/conf.d/{{ item }}"
    state: absent
  with_items:
    - "default.conf"
    - "virtual.conf"
    - "ssl.conf"
  tags:
    - elasticsearch-all
    - elasticsearch-nginx-setup

# Configure main Nginx settings
# Creates the primary Nginx configuration file
- name: Create main nginx config file
  template:
    src: "templates/nginx.conf.j2"
    dest: "/etc/nginx/nginx.conf"
    owner: root
    group: root
    mode: 0600
  tags:
    - elasticsearch-all
    - elasticsearch-nginx-setup
  register: nginx_conf_changed

# Set up Elasticsearch-specific Nginx configuration
# Creates Nginx configuration for Elasticsearch access
- name: Create nginx configs for Elasticsearch
  template:
    src: "templates/{{ item }}.j2"
    dest: "/etc/nginx/conf.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - "es.conf"
  notify:
    - Restart Nginx
  tags:
    - elasticsearch-all
    - elasticsearch-nginx-setup
  register: nginx_conf_changed

# Reload systemd configuration
# Forces systemd to reread configuration files
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

# Restart Elasticsearch service
# Restarts Elasticsearch when configuration changes are detected
- name: Restart ElasticSearch
  service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  when: elasticsearch_conf_changed.changed
  with_items:
    - elasticsearch
  tags:
    - elasticsearch-all
    - elasticsearch-install

# Enable and start services
# Ensures both Elasticsearch and Nginx start on boot and are running
- name: Enable services to survive reboot
  service:
    name: "{{ item }}"
    enabled: yes
    state: started
  with_items:
    - elasticsearch
    - nginx
  notify:
    - restart elasticsearch
  tags:
    - elasticsearch-all
    - elasticsearch-install

# Create Monit monitoring configuration
# Sets up monitoring for Elasticsearch service
- name: Create monit file
  template:
    src: "templates/{{ item }}.monit.j2"
    dest: "/etc/monit.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - elasticsearch
  register: monit_file
  tags:
    - elasticsearch-all
    - elasticsearch-monit

# Reload Monit configuration
# Applies any changes to the Monit monitoring setup
- name: Reload monit if config file changed
  service:
    name: monit
    state: reloaded
  when: monit_file.changed
  tags:
    - elasticsearch-all
    - elasticsearch-monit

- name: Flush handlers
  meta: flush_handlers
  when: elasticsearch.elastic_password is defined
  tags:
    - elasticsearch-all
    - elasticsearch-security

# Теперь ждем готовности Elasticsearch после перезапуска
- name: Wait for Elasticsearch to be ready after restart
  wait_for:
    port: "{{ elasticsearch_port }}"
    host: localhost
    delay: 30  # Даем время на полный запуск
    timeout: 300
  when: elasticsearch.elastic_password is defined
  tags:
    - elasticsearch-all
    - elasticsearch-security

- name: Install expect for password automation
  ansible.builtin.package:
    name: expect
    state: present
  when: elasticsearch.elastic_password is defined
  tags:
    - elasticsearch-all
    - elasticsearch-security

# Используйте простой expect one-liner
- name: Set elastic password using expect
  shell: |
    expect -c '
    spawn /usr/share/elasticsearch/bin/elasticsearch-reset-password -u {{ elasticsearch.elastic_username }} -i
    expect "Please confirm*"
    send "y\r"
    expect "Enter password*"
    send "{{ elasticsearch.elastic_password }}\r"
    expect "Re-enter password*"
    send "{{ elasticsearch.elastic_password }}\r"
    expect eof
    '
  when:
    - elasticsearch.elastic_password is defined
  tags:
    - elasticsearch-all
    - elasticsearch-security

- name: Flush handlers
  meta: flush_handlers
  when: elasticsearch.elastic_password is defined
  tags:
    - elasticsearch-all
    - elasticsearch-security
