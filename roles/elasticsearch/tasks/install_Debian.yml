# Debian/Ubuntu install path (Ubuntu 22.04 "jammy"): Elastic's apt repo + nginx.org apt repo.
# No Java task here: Elasticsearch 8.x bundles its own JDK (/usr/share/elasticsearch/jdk),
# used automatically via ES_JAVA_HOME set by the package — same runtime the RHEL install
# effectively uses despite also installing openjdk-11 (vestigial there, left byte-for-byte).
#
# Verified live (2026-07-09) against artifacts.elastic.co/packages/8.x/apt: 8.19.x is
# published (matches this role's shipped 8.19-*.j2 templates — see box.yml elasticsearch.version).

- name: "Debian | install apt prerequisites"
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: "Debian | ensure keyrings dir"
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Debian | install Elastic signing key (dearmored keyring)"
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch
    | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/elasticsearch-keyring.gpg

- name: "Debian | add Elastic 8.x apt repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    filename: "elastic-8.x"
    state: present
    update_cache: true

# First-install nuance (ES 8.x deb): the package post-install auto-configures X-Pack
# security (writes xpack.security... + certs, prints an autogenerated `elastic` password)
# but does NOT auto-start the service. main.yml's shared "Create Elasticsearch Config" task
# OVERWRITES elasticsearch.yml from the template (security-OFF branch, matching this env's
# capi which talks plain unauthenticated HTTP) before the first start — same ordering/effect
# as RHEL, so the auto-config is discarded and the autogenerated password never used.
- name: "Debian | install Elasticsearch {{ elasticsearch.version }} (pinned)"
  ansible.builtin.apt:
    name: "elasticsearch={{ elasticsearch.version }}.*"
    state: present
    update_cache: true
  notify:
    - restart elasticsearch

- name: "Debian | hold elasticsearch at the pinned minor (rolling 8.x repo)"
  ansible.builtin.dpkg_selections:
    name: elasticsearch
    selection: hold

- name: "Debian | install nginx"
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  notify:
    - restart elasticsearch
