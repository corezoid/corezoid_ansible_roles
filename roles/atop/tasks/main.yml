---
# tasks file for atop

- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: "atop role supports only RedHat/Debian families, got '{{ ansible_os_family }}'"
    quiet: true
  tags:
    - atop-all
    - atop-assert

- name: Install atop package (RedHat)
  ansible.builtin.yum:
    name: atop
    state: present
    update_cache: yes
  when: ansible_os_family == "RedHat"
  tags:
    - atop-all
    - atop-install

- name: Install atop package (Debian)
  ansible.builtin.apt:
    name: atop
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  tags:
    - atop-all
    - atop-install

- name: Create atop log directory
  file:
    path: "{{ atop_log_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - atop-all
    - atop-install

- name: Ensure logrotate stamp file exists
  file:
    path: "{{ atop_log_path }}/.logrotate-stamp"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  tags:
    - atop-all
    - atop-install

- name: Deploy atop sysconfig (RedHat)
  template:
    src: templates/atop.j2
    dest: /etc/sysconfig/atop
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "RedHat"
  notify: restart atop
  tags:
    - atop-all
    - atop-config

- name: Deploy atop defaults (Debian)
  template:
    src: templates/atop-default.j2
    dest: /etc/default/atop
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "Debian"
  notify: restart atop
  tags:
    - atop-all
    - atop-config

- name: Deploy atop logrotate config
  template:
    src: templates/atop-logrotate.j2
    dest: /etc/logrotate.d/atop
    owner: root
    group: root
    mode: "0644"
  tags:
    - atop-all
    - atop-config

# RHEL atop ships atop-rotate.timer to roll the daily log; on Debian/Ubuntu the
# packaged atop provides its own rotation (cron/timer) and this unit may be absent,
# so gate to RedHat. The logrotate stamp config below handles compression on both.
- name: Enable atop-rotate timer (RedHat)
  systemd:
    name: atop-rotate.timer
    enabled: yes
    state: started
  when: ansible_os_family == "RedHat"
  tags:
    - atop-all
    - atop-service

- name: Enable and start atop service
  systemd:
    name: atop
    enabled: yes
    state: started
  tags:
    - atop-all
    - atop-service
